name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's legacy default (tools platform-tools).
          # AGP 8.7.3 defaults to Build Tools 34.0.0; keep it alongside 35.0.0.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 build-tools;34.0.0'

      - name: Accept SDK licenses
        shell: bash
        run: |
          sdkmanager --licenses < <(for i in {1..100}; do echo y; done)

      - name: Validate and build debug APK
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: projector-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
